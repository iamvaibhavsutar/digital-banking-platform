# Local equivalent of the Ingress: /api/* routes to the backend services.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/accounts      { proxy_pass http://account-service:8080; }
  location /api/transfers     { proxy_pass http://transfer-service:8080; }
  location /api/transactions  { proxy_pass http://transaction-service:8080; }
  location /api/auth          { proxy_pass http://auth-service:8080; }
  location /api/notifications { proxy_pass http://notification-service:8080; }
  location / { try_files $uri /index.html; }
}
