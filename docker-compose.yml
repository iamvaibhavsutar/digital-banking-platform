services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bankdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  account-service:            # owns the schema (Flyway runs here)
    build: ./services/account-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bankdb
      DB_USER: bank
      DB_PASSWORD: bank123
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8081:8080"]

  transfer-service:           # waits for account-service so the tables already exist
    build: ./services/transfer-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bankdb
      DB_USER: bank
      DB_PASSWORD: bank123
      FLYWAY_ENABLED: "false"
    depends_on:
      account-service:
        condition: service_healthy
    ports: ["8082:8080"]

  portal:
    image: nginx:alpine
    volumes:
      - ./frontend/portal:/usr/share/nginx/html:ro
      - ./frontend/portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [account-service, transfer-service]

volumes:
  pgdata:
