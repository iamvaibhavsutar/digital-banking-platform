services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bankdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  account-service:            # owns the schema (Flyway runs here)
    build: ./services/account-service
    environment: &db
      DB_URL: jdbc:postgresql://postgres:5432/bankdb
      DB_USER: bank
      DB_PASSWORD: bank123
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8081:8080"]

  transfer-service:
    build: ./services/transfer-service
    environment: { <<: *db, FLYWAY_ENABLED: "false" }
    depends_on:
      account-service: { condition: service_healthy }
    ports: ["8082:8080"]

  transaction-service:
    build: ./services/transaction-service
    environment: { <<: *db, FLYWAY_ENABLED: "false" }
    depends_on:
      account-service: { condition: service_healthy }
    ports: ["8083:8080"]

  auth-service:
    build: ./services/auth-service
    environment:
      AUTH_SECRET: local-dev-secret
      AUTH_DEMO_PASSWORD: demo123
    ports: ["8084:8080"]

  notification-service:
    build: ./services/notification-service
    ports: ["8085:8080"]

  portal:
    image: nginx:alpine
    volumes:
      - ./frontend/portal:/usr/share/nginx/html:ro
      - ./frontend/portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [account-service, transfer-service, transaction-service, auth-service, notification-service]

volumes:
  pgdata:
