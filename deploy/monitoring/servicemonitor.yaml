apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: banking-backends, namespace: monitoring, labels: { release: monitoring } }
spec:
  namespaceSelector: { matchNames: [banking] }
  selector:
    matchLabels: { tier: backend }
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
