apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-golden-signals
  namespace: monitoring
  labels: { grafana_dashboard: "1" }
data:
  golden-signals.json: |
    {
      "title": "Banking - Golden Signals", "uid": "bank-golden", "schemaVersion": 39, "refresh": "30s",
      "time": { "from": "now-3h", "to": "now" },
      "panels": [
        { "id": 1, "type": "timeseries", "title": "Traffic (req/s per service)", "gridPos": {"x":0,"y":0,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{ "expr": "sum by (job) (rate(http_server_requests_seconds_count{job=~\".*-service\"}[5m]))", "legendFormat": "{{job}}" }] },
        { "id": 2, "type": "timeseries", "title": "Errors (5xx ratio)", "gridPos": {"x":12,"y":0,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{ "expr": "banking:error_ratio:rate5m", "legendFormat": "5xx ratio" }] },
        { "id": 3, "type": "timeseries", "title": "Latency p95 (s)", "gridPos": {"x":0,"y":8,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{ "expr": "histogram_quantile(0.95, sum by (le, job) (rate(http_server_requests_seconds_bucket{job=~\".*-service\"}[5m])))", "legendFormat": "{{job}}" }] },
        { "id": 4, "type": "timeseries", "title": "Saturation: DB pool in use / pending", "gridPos": {"x":12,"y":8,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [
            { "expr": "sum by (pod) (hikaricp_connections_active)", "legendFormat": "active {{pod}}" },
            { "expr": "sum by (pod) (hikaricp_connections_pending)", "legendFormat": "pending {{pod}}" } ] },
        { "id": 5, "type": "stat", "title": "Availability SLO (30d)", "gridPos": {"x":0,"y":16,"w":8,"h":5},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{ "expr": "1 - (sum(increase(http_server_requests_seconds_count{job=~\".*-service\",status=~\"5..\"}[30d])) / sum(increase(http_server_requests_seconds_count{job=~\".*-service\"}[30d])))" }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3 } } },
        { "id": 6, "type": "stat", "title": "Ready replicas (banking)", "gridPos": {"x":8,"y":16,"w":8,"h":5},
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "targets": [{ "expr": "sum(kube_deployment_status_replicas_ready{namespace=\"banking\"})" }] }
      ]
    }
