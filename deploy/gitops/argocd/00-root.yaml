# Apply once:  kubectl apply -f argocd/00-root.yaml   (replace <GITOPS_REPO_URL>)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: bank-root, namespace: argocd }
spec:
  project: default
  source:
    repoURL: <GITOPS_REPO_URL>
    targetRevision: main
    path: argocd
    directory: { recurse: false, exclude: "00-root.yaml" }
  destination: { server: https://kubernetes.default.svc, namespace: argocd }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
