apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: bank-base, namespace: argocd }
spec:
  project: default
  source:
    repoURL: <GITOPS_REPO_URL>
    targetRevision: main
    path: base
  destination: { server: https://kubernetes.default.svc, namespace: banking }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
