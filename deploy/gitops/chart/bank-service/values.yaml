name: ""                 # set per service in values/<service>.yaml
tier: backend            # backend | frontend  (ServiceMonitor selects tier=backend)
image:
  repository: ""
  tag: ""                # CI rewrites ONLY this line (sed '^\s*tag:')
  pullPolicy: IfNotPresent
replicaCount: 2
containerPort: 8080
runAsUser: 10001
env: {}                  # plain env vars
envFromConfigMap: []     # e.g. [bank-config]
secretEnv: []            # [{name: DB_PASSWORD, secret: db-credentials, key: DB_PASSWORD}]
javaOpts: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
probes:
  startup:   { path: /actuator/health/liveness,  failureThreshold: 30, periodSeconds: 5 }
  liveness:  { path: /actuator/health/liveness,  periodSeconds: 10, failureThreshold: 3 }
  readiness: { path: /actuator/health/readiness, periodSeconds: 5,  failureThreshold: 3 }
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits:   { memory: 640Mi }         # memory limit only: CPU limits throttle the JVM
service:
  port: 8080
ingress:
  enabled: true
  paths: []
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: true
