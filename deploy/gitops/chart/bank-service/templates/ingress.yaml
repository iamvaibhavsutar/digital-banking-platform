{{- if and .Values.ingress.enabled .Values.ingress.paths }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}
  labels: {{- include "bank.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.name }}
                port: { number: {{ $.Values.service.port }} }
          {{- end }}
{{- end }}
