name: portal
tier: frontend
runAsUser: 101
image:
  repository: <ACCOUNT>.dkr.ecr.ap-south-1.amazonaws.com/portal
  tag: 1.0.0
ingress:
  paths: ["/"]
probes:
  startup:   { path: /healthz, failureThreshold: 12, periodSeconds: 5 }
  liveness:  { path: /healthz, periodSeconds: 10, failureThreshold: 3 }
  readiness: { path: /healthz, periodSeconds: 5,  failureThreshold: 3 }
javaOpts: ""
resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { memory: 96Mi }
replicaCount: 2
