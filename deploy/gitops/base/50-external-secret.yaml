# Check `kubectl api-resources | grep external-secrets` and use v1 or v1beta1 accordingly.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: aws-parameter-store }
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-south-1              # no auth block: uses the node's IAM role
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: db-credentials, namespace: banking }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-parameter-store, kind: ClusterSecretStore }
  target: { name: db-credentials, creationPolicy: Owner }
  data:
    - secretKey: DB_PASSWORD
      remoteRef: { key: /banking/bank-dev/db/password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: auth-secrets, namespace: banking }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-parameter-store, kind: ClusterSecretStore }
  target: { name: auth-secrets, creationPolicy: Owner }
  data:
    - secretKey: AUTH_SECRET
      remoteRef: { key: /banking/bank-dev/auth/secret }
    - secretKey: AUTH_DEMO_PASSWORD
      remoteRef: { key: /banking/bank-dev/auth/demo-password }
