apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: banking-developer, namespace: banking }
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events", "endpoints"]   # NO secrets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: banking-developers, namespace: banking }
subjects:
  - { kind: Group, name: banking-devs, apiGroup: rbac.authorization.k8s.io }
roleRef: { kind: Role, name: banking-developer, apiGroup: rbac.authorization.k8s.io }
